name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Digi21.DigiNG.IO.Bin/Digi21.DigiNG.IO.Bin.csproj -c Release

      - name: Pack
        run: dotnet pack Digi21.DigiNG.IO.Bin/Digi21.DigiNG.IO.Bin.csproj -c Release --no-build -o artifacts -p:NuspecFile=../NuGet/Digi21.DigiNG.Io.Bin.nuspec -p:NuspecBasePath=../NuGet

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
